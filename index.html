html,body{margin:0;min-height:100%;background:#000;color:#F3E7C4;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
main{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;text-align:center}
img{width:132px;height:132px;border-radius:28px;display:block}
h1{font-size:1.5rem;margin:22px 0 4px;color:#E9BC4E;font-weight:700}
.sub{margin:0 0 26px;color:#B9A878;font-size:.95rem}
form{width:100%;max-width:330px;display:none}
form.on{display:block}
label{display:block;text-align:right;font-size:.9rem;color:#D8C792;margin-bottom:6px}
input[type=text]{width:100%;padding:14px 12px;font-size:1.15rem;letter-spacing:.06em;text-align:center;direction:ltr;border-radius:12px;border:1.5px solid #6E5A22;background:#0E0C06;color:#FFF3CF;font-family:ui-monospace,Menlo,Consolas,monospace}
input[type=text]:focus{outline:2px solid #E9BC4E;outline-offset:2px}
.rem{display:flex;align-items:center;gap:8px;justify-content:flex-start;margin:14px 2px;font-size:.92rem;color:#D8C792}
.rem input{width:20px;height:20px;accent-color:#E9BC4E}
button{width:100%;padding:14px;font-size:1.05rem;font-weight:700;border-radius:12px;border:0;background:#E9BC4E;color:#1A1403;cursor:pointer}
button:disabled{opacity:.6}
#msg{min-height:1.5em;margin:16px 0 0;font-size:.95rem;color:#D8C792}
#msg.err{color:#FF9A8F}
.note{margin-top:22px;font-size:.8rem;color:#8F8160;max-width:330px}

<button id="b" type="submit">פתיחה</button>
</form>
<p id="msg" role="status" aria-live="polite">טוען</p>
<p class="note">התוכן מוצפן. בלי ביטוי הגישה אי אפשר לקרוא אותו.</p>

function $(i){return document.getElementById(i);}
function say(t,err){var m=$("msg");m.textContent=t;m.className=err?"err":"";}
function ub(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;}
function idb(){return new Promise(function(res,rej){var q=indexedDB.open("lsk-hub",1);q.onupgradeneeded=function(){q.result.createObjectStore("k");};q.onsuccess=function(){res(q.result);};q.onerror=function(){rej(q.error);};});}
function kget(){return idb().then(function(d){return new Promise(function(res){var q=d.transaction("k").objectStore("k").get("priv");q.onsuccess=function(){res(q.result||null);};q.onerror=function(){res(null);};});}).catch(function(){return null;});}
function kput(k){return idb().then(function(d){return new Promise(function(res){var t=d.transaction("k","readwrite");t.objectStore("k").put(k,"priv");t.oncomplete=function(){res();};t.onerror=function(){res();};t.onabort=function(){res();};});}).catch(function(){});}
function kdel(){return idb().then(function(d){return new Promise(function(res){var t=d.transaction("k","readwrite");t.objectStore("k").delete("priv");t.oncomplete=function(){res();};t.onerror=function(){res();};t.onabort=function(){res();};});}).catch(function(){});}
async function keyFrom(pass){
  var norm=String(pass).toLowerCase().replace(/[^a-z0-9]/g,"");
  var base=await crypto.subtle.importKey("raw",new TextEncoder().encode(norm),"PBKDF2",false,["deriveKey"]);
  var kek=await crypto.subtle.deriveKey({name:"PBKDF2",salt:ub(KB.salt),iterations:KB.iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  var pk8=await crypto.subtle.decrypt({name:"AES-GCM",iv:ub(KB.iv)},kek,ub(KB.ct));
  return crypto.subtle.importKey("pkcs8",pk8,{name:"RSA-OAEP",hash:"SHA-256"},false,["decrypt"]);
}
async function open1(priv,url,optional){
  var r;try{r=await fetch(url+"?t="+Date.now(),{cache:"no-store"});}catch(e){if(optional)return null;throw {net:true};}
  if(!r.ok){if(optional)return null;throw {net:true};}
  var e=await r.json();
  var raw=await crypto.subtle.decrypt({name:"RSA-OAEP"},priv,ub(e.wk));
  var key=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);
  var gz=await crypto.subtle.decrypt({name:"AES-GCM",iv:ub(e.iv)},key,ub(e.ct));
  var txt=await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
  return JSON.parse(txt);
}
function fls(block){var m=/var FLS="(\d\d)\.(\d\d)\.(\d{4}), (\d\d):(\d\d)"/.exec(block||"");return m?+(m[3]+m[2]+m[1]+m[4]+m[5]):0;}
async function launch(priv){
  var app=await open1(priv,"app.enc"),upd=null;
  try{upd=await open1(priv,"data.enc",true);}catch(e){upd=null;}
  var html=app.html,snap=app.snap||null;
  if(upd){
    if(typeof upd.block==="string"){var a=html.indexOf(START),b=html.indexOf(END);if(a>=0&&b>a&&fls(upd.block)>fls(html.slice(a,b)))html=html.slice(0,a)+upd.block.trim()+html.slice(b+END.length);}
    if(upd.snap&&(!snap||(+upd.snap.at||0)>(+snap.at||0)))snap=upd.snap;
  }
  window.LSK_STANDALONE=true;window.LSK_SNAP=snap;
  document.open();document.write(html);document.close();
}
function form(on){$("f").className=on?"on":"";if(on){say("");try{$("p").focus();}catch(e){}}}
function fail(e){if(e&&e.net)say("אין חיבור לרשת, או שהתוכן אינו זמין כעת. נסה שוב.",true);else say("התוכן לא נפתח. הזן שוב את ביטוי הגישה.",true);}
async function start(){
  if(!(window.crypto&&crypto.subtle&&window.indexedDB&&window.DecompressionStream)){say("הדפדפן הזה אינו תומך בפתיחה מאובטחת. נסה בגרסה עדכנית של Safari.",true);return;}
  if(location.hash==="#lock"){await kdel();try{history.replaceState(null,"",location.pathname+location.search);}catch(e){}form(true);say("האפליקציה ננעלה במכשיר הזה.");return;}
  var k=await kget();
  if(!k){form(true);return;}
  say("פותח");
  try{await launch(k);}catch(e){if(!(e&&e.net))await kdel();form(true);fail(e);}
}
$("f").addEventListener("submit",async function(ev){ev.preventDefault();var b=$("b"),pass=$("p").value;if(!pass.trim())return;b.disabled=true;say("פותח");
  var k=null;try{k=await keyFrom(pass);}catch(e){b.disabled=false;say("ביטוי הגישה שגוי.",true);return;}
  if($("r").checked)await kput(k);
  try{await launch(k);}catch(e){b.disabled=false;fail(e);}
});
start();
})();
